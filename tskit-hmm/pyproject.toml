[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "numpy>=2"
]
build-backend = "setuptools.build_meta"

[project]
name = "tskit-hmm"
version = "0.0.1.dev0"
authors = [
    {name = "Tskit Developers", email = "admin@tskit.dev"},
]
description = "The tskit Li and Stephens HMM."
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: C",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=2",
    "tskit>=1.0.0",
]

[project.urls]
"Source Code" = "https://github.com/tskit-dev/tsls/"

[dependency-groups]
test = [
    "lshmm",
    "msprime",
    "pytest",
    "pytest-xdist",
]

[tool.setuptools]
packages = ["tskit_hmm"]
include-package-data = true

[tool.pytest.ini_options]
addopts = "-n 4"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 89

[tool.ruff.lint.isort]
known-first-party = ["_tskit_hmm", "tskit_hmm"]
