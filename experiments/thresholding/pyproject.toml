[project]
name = "tsls-thresholding-experiments"
version = "0.0.0"
description = "Experiments on likelihood thresholding and pruning in tsls."
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "msprime",
    "numpy>=2",
    "pandas",
    "tabulate",
    "tqdm",
    "tskit>=1.0.0",
    "tsls",
]

[tool.uv]
package = false

[tool.uv.sources]
tsls = { path = "../../tsls", editable = true }

[tool.ruff]
line-length = 89

[tool.ruff.lint.isort]
known-first-party = ["dense", "tsls", "verification"]
