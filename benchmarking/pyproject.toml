[project]
name = "tsls-benchmarking"
version = "0.0.0"
description = "Benchmarks for the Li and Stephens HMM implementations in tsls."
requires-python = ">=3.11"
dependencies = [
    "click",
    "numpy>=2",
    "pandas",
    "tqdm",
    "tskit>=1.0.0",
    "tszip",
    "tsinfer-hmm",
    "tskit-hmm",
    "tsls",
]

[dependency-groups]
test = [
    "msprime",
    "pytest",
]

[tool.uv]
package = false

[tool.uv.sources]
tsinfer-hmm = { path = "../tsinfer-hmm", editable = true }
tskit-hmm = { path = "../tskit-hmm", editable = true }
tsls = { path = "../tsls", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 89
